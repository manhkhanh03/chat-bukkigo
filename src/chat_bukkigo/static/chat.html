<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bukkigo Nail Chat</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbf9f7;
      --surface: rgba(255, 255, 255, 0.92);
      --ink: #25211f;
      --muted: #7d746f;
      --line: #e9e2dd;
      --accent: #b8566d;
      --accent-dark: #943d55;
      --user: #322d2b;
      --error: #a43b3b;
      --shadow: 0 18px 60px rgba(72, 48, 40, 0.1);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 0%, rgba(203, 132, 151, 0.13), transparent 34%),
        radial-gradient(circle at 85% 100%, rgba(215, 180, 155, 0.15), transparent 38%),
        var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: min(860px, 100%);
      height: 100dvh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: 1fr auto;
      position: relative;
    }

    .messages {
      min-height: 0;
      overflow-y: auto;
      padding: clamp(28px, 6vw, 72px) clamp(18px, 5vw, 52px) 32px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: #d9cfca transparent;
    }

    .empty {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding-bottom: 12vh;
      text-align: center;
      color: var(--muted);
      transition: opacity 180ms ease;
    }

    .empty strong {
      display: block;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 500;
      letter-spacing: -0.035em;
      margin-bottom: 10px;
    }

    .empty span { font-size: 14px; }

    .message {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin: 0 0 24px;
      animation: arrive 220ms ease both;
    }

    .message.user { align-items: flex-end; }
    .message.assistant { align-items: flex-start; }

    .bubble {
      max-width: min(680px, 88%);
      padding: 13px 16px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.62;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      color: white;
      background: var(--user);
      border-bottom-right-radius: 7px;
    }

    .assistant .bubble {
      background: var(--surface);
      border: 1px solid var(--line);
      border-bottom-left-radius: 7px;
      box-shadow: 0 8px 30px rgba(62, 45, 38, 0.05);
    }

    .assistant .bubble.streaming::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 3px;
      vertical-align: -0.12em;
      background: var(--accent);
      animation: blink 850ms steps(1) infinite;
    }

    .assistant.error .bubble {
      color: var(--error);
      border-color: rgba(164, 59, 59, 0.24);
      background: rgba(255, 248, 248, 0.96);
    }

    .metric {
      padding: 0 5px;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.015em;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 20px;
    }

    .typing i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.35;
      animation: bounce 1.1s ease-in-out infinite;
    }

    .typing i:nth-child(2) { animation-delay: 130ms; }
    .typing i:nth-child(3) { animation-delay: 260ms; }

    .composer-shell {
      padding: 14px clamp(14px, 4vw, 38px) max(18px, env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--paper) 72%, transparent);
    }

    .composer {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 10px;
      padding: 10px 10px 10px 18px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .composer:focus-within {
      border-color: rgba(184, 86, 109, 0.48);
      box-shadow: 0 18px 65px rgba(111, 64, 74, 0.14);
    }

    textarea {
      width: 100%;
      min-height: 27px;
      max-height: 150px;
      resize: none;
      overflow-y: auto;
      border: 0;
      outline: 0;
      padding: 5px 0 3px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      line-height: 1.45;
    }

    textarea::placeholder { color: #a59b96; }

    button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-size: 20px;
      transition: transform 140ms ease, background 140ms ease, opacity 140ms ease;
    }

    button:hover { background: var(--accent-dark); transform: translateY(-1px); }
    button:active { transform: translateY(0) scale(0.96); }
    button:disabled { cursor: default; opacity: 0.55; transform: none; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 65%, 100% { transform: translateY(0); opacity: 0.32; }
      35% { transform: translateY(-4px); opacity: 0.9; }
    }

    @keyframes blink { 50% { opacity: 0; } }

    @media (max-width: 600px) {
      .messages { padding-top: 28px; }
      .bubble { max-width: 94%; }
      .composer-shell { padding-left: 10px; padding-right: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="messages" class="messages" aria-live="polite">
      <div id="empty" class="empty">
        <div>
          <strong>Hôm nay bạn muốn bộ nail thế nào?</strong>
          <span>Mô tả dịp, phong cách hoặc cảm giác bạn đang tìm.</span>
        </div>
      </div>
    </section>

    <div class="composer-shell">
      <form id="composer" class="composer">
        <textarea
          id="message"
          rows="1"
          maxlength="12000"
          placeholder="Nhắn điều bạn đang nghĩ…"
          aria-label="Tin nhắn"
          autofocus
        ></textarea>
        <button id="send" type="submit" aria-label="Gửi tin nhắn">↑</button>
      </form>
    </div>
  </main>

  <script>
    const messages = document.querySelector("#messages");
    const empty = document.querySelector("#empty");
    const form = document.querySelector("#composer");
    const input = document.querySelector("#message");
    const send = document.querySelector("#send");
    const history = [];
    let running = false;

    const seconds = (milliseconds) => `${(milliseconds / 1000).toFixed(2)}s`;

    function tracedError(message, traceId = null) {
      const error = new Error(message);
      error.traceId = traceId;
      return error;
    }

    function scrollToLatest() {
      messages.scrollTop = messages.scrollHeight;
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = `${Math.min(input.scrollHeight, 150)}px`;
    }

    function addMessage(role, text = "") {
      empty.hidden = true;
      const wrapper = document.createElement("article");
      wrapper.className = `message ${role}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrapper.appendChild(bubble);
      messages.appendChild(wrapper);
      scrollToLatest();
      return { wrapper, bubble };
    }

    function showTyping(bubble) {
      bubble.textContent = "";
      const indicator = document.createElement("span");
      indicator.className = "typing";
      indicator.setAttribute("aria-label", "Đang trả lời");
      indicator.innerHTML = "<i></i><i></i><i></i>";
      bubble.appendChild(indicator);
    }

    function appendMetric(wrapper) {
      const metric = document.createElement("div");
      metric.className = "metric";
      wrapper.appendChild(metric);
      return metric;
    }

    function parseSSE(block) {
      let event = "message";
      const data = [];
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        if (line.startsWith("data:")) data.push(line.slice(5).trimStart());
      }
      if (!data.length) return null;
      return { event, data: JSON.parse(data.join("\n")) };
    }

    async function readSSE(response, onEvent) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        buffer = buffer.replaceAll("\r\n", "\n");
        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) >= 0) {
          const block = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          const parsed = parseSSE(block);
          if (parsed) onEvent(parsed);
        }
        if (done) break;
      }
    }

    async function sendMessage(message) {
      running = true;
      send.disabled = true;
      input.disabled = true;

      addMessage("user", message);
      const assistant = addMessage("assistant");
      showTyping(assistant.bubble);
      const metric = appendMetric(assistant.wrapper);
      const clientStarted = performance.now();
      let firstTokenAt = null;
      let answer = "";
      let doneData = null;
      let streamError = null;

      const ticker = window.setInterval(() => {
        const label = firstTokenAt ? "Đang trả lời" : "Đang suy nghĩ";
        metric.textContent = `${label} · ${seconds(performance.now() - clientStarted)}`;
      }, 100);

      try {
        const response = await fetch("/v1/chat/stream", {
          method: "POST",
          headers: {
            "Accept": "text/event-stream",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ message, history }),
        });

        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          const detail = payload.detail;
          if (detail && typeof detail === "object") {
            throw tracedError(detail.message || `HTTP ${response.status}`, detail.trace_id);
          }
          throw tracedError(detail || `HTTP ${response.status}`);
        }

        await readSSE(response, ({ event, data }) => {
          if (event === "delta") {
            if (firstTokenAt === null) {
              firstTokenAt = performance.now();
              assistant.bubble.textContent = "";
              assistant.bubble.classList.add("streaming");
            }
            answer += data.text;
            assistant.bubble.textContent = answer;
            scrollToLatest();
          } else if (event === "done") {
            doneData = data;
          } else if (event === "error") {
            streamError = data;
          }
        });

        if (streamError) {
          throw tracedError(
            streamError.message || "Luồng trả lời bị gián đoạn",
            streamError.trace_id,
          );
        }
        if (!answer) throw new Error("Không nhận được nội dung trả lời");

        assistant.bubble.classList.remove("streaming");
        const clientTotal = performance.now() - clientStarted;
        const ttft = doneData?.time_to_first_token_ms ?? (firstTokenAt - clientStarted);
        const serverTotal = doneData?.total_ms;
        metric.textContent = [
          `Tổng ${seconds(clientTotal)}`,
          `token đầu ${seconds(ttft)}`,
          serverTotal == null ? null : `server ${seconds(serverTotal)}`,
        ].filter(Boolean).join(" · ");

        history.push(
          { role: "user", content: message },
          { role: "assistant", content: answer },
        );
      } catch (error) {
        assistant.wrapper.classList.add("error");
        assistant.bubble.classList.remove("streaming");
        const trace = error.traceId ? ` (mã: ${error.traceId})` : "";
        assistant.bubble.textContent = `Không thể trả lời: ${error.message}${trace}`;
        metric.textContent = `Dừng sau ${seconds(performance.now() - clientStarted)}`;
      } finally {
        window.clearInterval(ticker);
        running = false;
        send.disabled = false;
        input.disabled = false;
        input.focus();
        scrollToLatest();
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message || running) return;
      input.value = "";
      resizeInput();
      sendMessage(message);
    });

    input.addEventListener("input", resizeInput);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
